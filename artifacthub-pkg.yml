install: |
  ## Desktop Installation

  Download the latest release tarball and extract to your Headlamp plugins directory:

  ```bash
  tar -xzf headlamp-nmstate-*.tar.gz -C ~/.config/Headlamp/plugins/
  ```

  ## In-Cluster Installation

  Add as an init container to your Headlamp deployment:

  ```yaml
  initContainers:
    - name: headlamp-nmstate
      image: ghcr.io/naval-group/headlamp-nmstate:latest
      command: ["/bin/sh", "-c"]
      args: ["cp -r /plugins/nmstate /headlamp-plugins/"]
      volumeMounts:
        - name: headlamp-plugins
          mountPath: /headlamp-plugins
  ```
